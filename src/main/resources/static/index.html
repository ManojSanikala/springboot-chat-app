<script>

    /* =====================================================
       PROFILE CUSTOMIZATION HELPERS
       These additions do not alter existing chat logic.
    ===================================================== */

    let receiverBlockedSafe = false;

    function getLoggedUsernameSafe() {
        try {
            const token = localStorage.getItem("token");
            if (!token) return "User";

            const parts = token.split(".");
            if (parts.length !== 3) return "User";

            const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
            return payload.sub || payload.username || payload.name || "User";
        } catch (error) {
            return "User";
        }
    }

    function getReceiverUsernameSafe() {
        if (typeof currentChatUser !== "undefined" && currentChatUser) {
            return currentChatUser;
        }

        const chatWith = document.getElementById("chatWith");
        if (chatWith && chatWith.textContent.trim() !== "Select User") {
            return chatWith.textContent.trim();
        }

        return "";
    }

    function toggleLoggedProfileMenu(event) {
        if (event) event.stopPropagation();

        const menu = document.getElementById("loggedProfileMenu");
        if (!menu) return;

        menu.classList.toggle("show");
        closeReceiverOptions();
        closeReceiverProfilePanel();

        const name = document.getElementById("loggedProfileName");
        if (name) name.textContent = getLoggedUsernameSafe();
    }

    function openLoggedSettings() {
        const menu = document.getElementById("loggedProfileMenu");
        if (menu) menu.classList.remove("show");

        if (typeof openSettings === "function") {
            openSettings();
            return;
        }

        alert("Settings");
    }

    function openReceiverProfilePanel() {
        const username = getReceiverUsernameSafe();
        if (!username) return;

        const panel = document.getElementById("receiverProfilePanel");
        if (!panel) return;

        document.getElementById("receiverProfileName").textContent = username;
        document.getElementById("receiverProfileUsername").textContent = username;
        document.getElementById("receiverProfileStatus").textContent = "Available";

        panel.classList.toggle("show");
        closeReceiverOptions();
    }

    function closeReceiverProfilePanel() {
        const panel = document.getElementById("receiverProfilePanel");
        if (panel) panel.classList.remove("show");
    }

    function toggleReceiverOptions(event) {
        if (event) event.stopPropagation();

        const menu = document.getElementById("receiverOptionsMenu");
        if (!menu) return;

        menu.classList.toggle("show");
        closeReceiverProfilePanel();

        const logged = document.getElementById("loggedProfileMenu");
        if (logged) logged.classList.remove("show");
    }

    function closeReceiverOptions() {
        const menu = document.getElementById("receiverOptionsMenu");
        if (menu) menu.classList.remove("show");

        const disappearing = document.getElementById("receiverDisappearingMenu");
        if (disappearing) disappearing.classList.remove("show");
    }

    function toggleReceiverBlockSafe() {
        const username = getReceiverUsernameSafe();
        if (!username) {
            alert("Select a user first.");
            return;
        }

        receiverBlockedSafe = !receiverBlockedSafe;
        updateReceiverBlockButtonSafe();
        closeReceiverOptions();

        /*
         * Backend block/unblock should be connected here in the
         * backend implementation. The UI is intentionally isolated
         * so existing message functionality is not changed.
         */
    }

    function updateReceiverBlockButtonSafe() {
        const text = document.getElementById("receiverBlockText");
        const icon = document.getElementById("receiverBlockIcon");

        if (!text || !icon) return;

        if (receiverBlockedSafe) {
            text.textContent = "Unblock";
            icon.className = "fa-solid fa-unlock";
        } else {
            text.textContent = "Block";
            icon.className = "fa-solid fa-ban";
        }
    }

    function openReceiverDisappearingMenu() {
        const mainMenu = document.getElementById("receiverOptionsMenu");
        const disappearing = document.getElementById("receiverDisappearingMenu");

        if (!disappearing) return;

        if (mainMenu) mainMenu.classList.remove("show");
        disappearing.classList.toggle("show");
    }

    function setReceiverDisappearingSafe(minutes) {
        const username = getReceiverUsernameSafe();
        if (!username) {
            alert("Select a user first.");
            return;
        }

        const disappearing = document.getElementById("receiverDisappearingMenu");
        if (disappearing) disappearing.classList.remove("show");

        if (minutes === 0) {
            alert("Disappearing messages turned off.");
            return;
        }

        alert("Disappearing messages set for " + formatProfileDurationSafe(minutes) + ".");
    }

    function openCustomReceiverDisappearingSafe() {
        const value = prompt("Enter the number of minutes:", "30");
        if (value === null) return;

        const minutes = Number(value);
        if (!Number.isFinite(minutes) || minutes <= 0) {
            alert("Enter a valid number of minutes.");
            return;
        }

        setReceiverDisappearingSafe(minutes);
    }

    function formatProfileDurationSafe(minutes) {
        if (minutes < 60) return minutes + " minutes";
        if (minutes % 1440 === 0) return (minutes / 1440) + " days";
        if (minutes % 60 === 0) return (minutes / 60) + " hours";
        return minutes + " minutes";
    }

    function openMediaLinksDocsSafe() {
        const panel = document.getElementById("mediaLinksDocsPanel");
        if (!panel) return;

        closeReceiverOptions();
        closeReceiverProfilePanel();
        panel.classList.add("show");
        filterMediaLinksDocsSafe("all");
    }

    function closeMediaLinksDocsSafe() {
        const panel = document.getElementById("mediaLinksDocsPanel");
        if (panel) panel.classList.remove("show");
    }

    function classifyMessageForMediaSafe(messageElement) {
        const text = (messageElement.textContent || "").trim();
        const lower = text.toLowerCase();
        const hasImage = !!messageElement.querySelector("img");
        const hasAudio = !!messageElement.querySelector("audio");
        const hasVideo = !!messageElement.querySelector("video");
        const links = Array.from(messageElement.querySelectorAll("a[href]"));
        const hrefs = links.map(a => (a.getAttribute("href") || "").toLowerCase());
        const hasUrlText = /https?:\/\/\S+|www\.\S+/i.test(text);
        const documentPattern = /\.(pdf|doc|docx|txt|xls|xlsx|ppt|pptx|csv|zip)(?:$|[?#])/i;
        const hasDocument = hrefs.some(h => documentPattern.test(h)) || documentPattern.test(text);
        const hasMedia = hasImage || hasAudio || hasVideo || hrefs.some(h => /\.(jpg|jpeg|png|gif|webp|mp4|webm|mov|mp3|wav|ogg)(?:$|[?#])/i.test(h));
        const hasLink = links.length > 0 || hasUrlText;

        if (hasMedia) return "media";
        if (hasDocument) return "docs";
        if (hasLink) return "links";
        return null;
    }

    function filterMediaLinksDocsSafe(filter) {
        const list = document.getElementById("mediaLinksDocsList");
        if (!list) return;

        document.querySelectorAll(".media-links-docs-tab").forEach(function(tab) {
            tab.classList.toggle("active", tab.getAttribute("data-media-filter") === filter);
        });

        list.innerHTML = "";

        const messageElements = Array.from(
            document.querySelectorAll('#chat > div[id^="message-"]')
        );

        let count = 0;

        messageElements.forEach(function(messageElement) {
            const type = classifyMessageForMediaSafe(messageElement);
            if (!type || (filter !== "all" && type !== filter)) return;

            const image = messageElement.querySelector("img");
            const audio = messageElement.querySelector("audio");
            const video = messageElement.querySelector("video");
            const link = messageElement.querySelector("a[href]");
            const messageText = (messageElement.textContent || "").replace(/\s+/g, " ").trim();

            const item = document.createElement("div");
            item.className = "media-links-docs-item";

            if (image) {
                const thumb = document.createElement("img");
                thumb.className = "media-links-docs-thumb";
                thumb.src = image.src;
                thumb.alt = "Media";
                item.appendChild(thumb);
            } else {
                const icon = document.createElement("div");
                icon.className = "media-links-docs-icon";
                icon.innerHTML = type === "docs"
                    ? '<i class="fa-solid fa-file-lines"></i>'
                    : type === "links"
                        ? '<i class="fa-solid fa-link"></i>'
                        : audio
                            ? '<i class="fa-solid fa-volume-high"></i>'
                            : video
                                ? '<i class="fa-solid fa-video"></i>'
                                : '<i class="fa-solid fa-photo-film"></i>';
                item.appendChild(icon);
            }

            const info = document.createElement("div");
            info.className = "media-links-docs-info";

            const name = document.createElement("div");
            name.className = "media-links-docs-name";
            name.textContent = link
                ? (link.textContent || link.getAttribute("href") || "Link").trim()
                : messageText || (type === "media" ? "Media" : "Document");
            info.appendChild(name);

            if (link) {
                const action = document.createElement("a");
                action.className = "media-links-docs-action";
                action.href = link.href;
                action.target = "_blank";
                action.rel = "noopener noreferrer";
                action.textContent = type === "docs" ? "Open document" : "Open link";
                info.appendChild(action);
            } else if (image) {
                const action = document.createElement("a");
                action.className = "media-links-docs-action";
                action.href = image.src;
                action.target = "_blank";
                action.rel = "noopener noreferrer";
                action.textContent = "Open media";
                info.appendChild(action);
            }

            item.appendChild(info);
            list.appendChild(item);
            count++;
        });

        if (count === 0) {
            const empty = document.createElement("div");
            empty.className = "media-links-docs-empty";
            empty.textContent = filter === "all"
                ? "No media, links or documents in this chat."
                : "No " + (filter === "docs" ? "documents" : filter) + " found.";
            list.appendChild(empty);
        }
    }

    document.addEventListener("click", function(event) {
        const loggedMenu = document.getElementById("loggedProfileMenu");
        const receiverMenu = document.getElementById("receiverOptionsMenu");
        const receiverButton = document.getElementById("receiverMenuButton");
        const mediaPanel = document.getElementById("mediaLinksDocsPanel");
        const receiverPanel = document.getElementById("receiverProfilePanel");

        if (loggedMenu && !loggedMenu.contains(event.target) && !event.target.closest(".profile-menu-button")) {
            loggedMenu.classList.remove("show");
        }

        if (receiverMenu && receiverButton && !receiverMenu.contains(event.target) && !receiverButton.contains(event.target)) {
            receiverMenu.classList.remove("show");
        }

        if (receiverPanel && !receiverPanel.contains(event.target) && !event.target.closest("#chatWith")) {
            receiverPanel.classList.remove("show");
        }
    });


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

/*
         * Stop WebSocket
         */

        if (
            typeof stompClient !== "undefined" &&
            stompClient &&
            stompClient.connected
        ) {

            try {

                stompClient.disconnect(
                    function () {

}
                );

            }
            catch (error) {

}

        }

        /*
         * Remove JWT
         */

        localStorage.removeItem(
            "token"
        );

        /*
         * Clear session
         */

        sessionStorage.clear();

        /*
         * Go to login
         */

        window.location.replace(
            "/login.html"
        );

    }

    /* =====================================================
       CHECK LOGIN
    ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const token =
                localStorage.getItem(
                    "token"
                );

            if (!token) {

                window.location.replace(
                    "/login.html"
                );

                return;

            }

}
    );

</script>
