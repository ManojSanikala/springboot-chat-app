spring.application.name=Chat-Aplication-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CHAT_APP}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:YourLongRandomSecretKeyForChatApplication2026@SpringBoot}
jwt.expiration=${JWT_EXPIRATION:604800000}

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB